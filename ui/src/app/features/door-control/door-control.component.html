<section class="control-panel" aria-labelledby="control-title">
  <div class="panel-heading">
    <div>
      <p class="panel-kicker">{{ 'commandCenter' | translate }}</p>
      <h2 id="control-title">{{ 'setDoorState' | translate }}</h2>
    </div>
    <span class="status-dot" aria-hidden="true"></span>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="door-id">{{ 'doorId' | translate }}</label>
    <input
      id="door-id"
      type="text"
      formControlName="id"
      placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      autocomplete="off"
      spellcheck="false"
      aria-describedby="door-id-hint door-id-error"
    />
    <p id="door-id-hint" class="field-hint">{{ 'doorIdHint' | translate }}</p>
    @if (form.controls.id.invalid && form.controls.id.touched) {
      <p id="door-id-error" class="field-error">{{ 'doorIdError' | translate }}</p>
    }

    <fieldset>
      <legend>{{ 'desiredState' | translate }}</legend>
      <div class="state-options">
        <label class="state-option" [class.selected]="form.controls.open.value">
          <input type="radio" formControlName="open" [value]="true" />
          <span>{{ 'open' | translate }}</span>
        </label>
        <label class="state-option" [class.selected]="!form.controls.open.value">
          <input type="radio" formControlName="open" [value]="false" />
          <span>{{ 'closed' | translate }}</span>
        </label>
      </div>
    </fieldset>

    <button type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        {{ 'updatingDoor' | translate }}
      } @else {
        {{ 'updateDoor' | translate }}
      }
    </button>

    @if (feedback(); as status) {
      <p class="feedback" [class.success]="status.type === 'success'" [class.error]="status.type === 'error'" role="status">
        {{ status.message | translate }}
      </p>
    }
  </form>
</section>
