<main class="app-shell">
  <div class="app-header">
    <div class="header-row">
      <div>
        <p class="eyebrow">{{ 'eyebrow' | translate }}</p>
        <h1>{{ 'pageTitle' | translate }}</h1>
      </div>
      <div class="header-actions">
        <label class="visually-hidden" for="language-select">{{ 'language' | translate }}</label>
        <select id="language-select" class="language-select" [value]="i18n.locale()" (change)="changeLocale($event)">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
        </select>
        @if (auth.user(); as user) {
          @if (user.authenticated) {
            <button class="session-button" type="button" (click)="auth.logout()">{{ 'logOut' | translate }}</button>
          } @else {
            <button class="session-button" type="button" (click)="auth.login()">{{ 'logInWithGoogle' | translate }}</button>
          }
        }
      </div>
    </div>
    <p class="intro">{{ 'intro' | translate }}</p>
  </div>

  @if (auth.user(); as user) {
    @if (user.authenticated) {
      <app-door-control></app-door-control>
    } @else {
      <p class="login-prompt">{{ 'loginPrompt' | translate }}</p>
    }
  }
</main>
