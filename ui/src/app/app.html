<main class="app-shell">
  <div class="app-header">
    <div class="header-row">
      <div>
        <p class="eyebrow">Door access control</p>
        <h1>Open a door remotely</h1>
      </div>
      @if (auth.user(); as user) {
        @if (user.authenticated) {
          <button class="session-button" type="button" (click)="auth.logout()">Log out</button>
        } @else {
          <button class="session-button" type="button" (click)="auth.login()">Log in with Google</button>
        }
      }
    </div>
    <p class="intro">Send a secure state update to a registered door.</p>
  </div>

  @if (auth.user(); as user) {
    @if (user.authenticated) {
      <app-door-control></app-door-control>
    } @else {
      <p class="login-prompt">Log in to control a registered door.</p>
    }
  }
</main>
